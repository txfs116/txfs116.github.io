<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁芙奖投票</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #ffa3c4;
            --pink-dark: #e8557d;
            --bg: #fff0f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe4ec 0%, #fff0f5 30%, #ffe0ec 60%, #fce4ec 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        /* 背景浮动爱心 */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp linear infinite;
            opacity: 0.35;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            8% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.3;
            }
            85% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(-15vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 弹窗 */
        .modal {
            position: relative;
            width: min(440px, 92vw);
            min-height: 300px;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 28px 28px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.25), 0 8px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
            z-index: 101;
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ffe0ec;
            overflow: visible;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7) translateY(30px);
                opacity: 0;
            }
            60% {
                transform: scale(1.04) translateY(-5px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal.shake {
            animation: shakeModal 0.45s ease-out;
        }

        @keyframes shakeModal {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-8px);
            }
            30% {
                transform: translateX(8px);
            }
            45% {
                transform: translateX(-6px);
            }
            60% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-3px);
            }
            90% {
                transform: translateX(2px);
            }
        }

        /* 标题图标 */
        .modal-icon {
            font-size: 52px;
            margin-bottom: 8px;
            animation: bounceIcon 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-14px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-8px);
            }
            85% {
                transform: translateY(0);
            }
        }

        /* 问题文字 */
        .modal-question {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a3040;
            margin-bottom: 6px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: #b8909e;
            margin-bottom: 10px;
            font-weight: 400;
        }

        /* 按钮容器 - 使用relative定位，给absolute按钮提供参考 */
        .btn-area {
            position: relative;
            width: 100%;
            height: 160px;
            margin-top: 10px;
        }

        /* 按钮通用样式 */
        .btn {
            position: absolute;
            padding: 13px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 0.8px;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            outline: none;
            z-index: 10;
            white-space: nowrap;
            min-width: 90px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* Yes按钮 - 固定在右下区域 */
        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: #fff;
            box-shadow: 0 6px 22px rgba(255, 64, 129, 0.4);
            bottom: 20px;
            right: 50px;
            z-index: 20;
            animation: pulseYes 2.2s ease-in-out infinite;
            border: 2px solid #ff4081;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(255, 64, 129, 0.55);
            background: linear-gradient(135deg, #ff7dae 0%, #ff5090 100%);
        }

        .btn-yes:active {
            transform: scale(0.9);
            box-shadow: 0 4px 14px rgba(255, 64, 129, 0.5);
        }

        @keyframes pulseYes {
            0%,
            100% {
                box-shadow: 0 6px 22px rgba(255, 64, 129, 0.4);
            }
            50% {
                box-shadow: 0 10px 34px rgba(255, 64, 129, 0.7), 0 0 0 10px rgba(255, 107, 157, 0.1);
            }
        }

        /* No按钮 - 会逃跑 */
        .btn-no {
            background: #f5f5f5;
            color: #888;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            bottom: 20px;
            left: 50px;
            z-index: 15;
            border: 2px solid #e0e0e0;
            cursor: pointer;
        }

        .btn-no:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
            background: #eee;
        }

        .btn-no.fleeing {
            animation: fleePop 0.2s ease-out;
        }

        @keyframes fleePop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.75);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 爱心飘落容器 */
        .hearts-burst {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        .burst-heart {
            position: absolute;
            font-size: 30px;
            animation: burstFall 1.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes burstFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            30% {
                opacity: 1;
                transform: translateY(-60px) rotate(25deg) scale(1.4);
            }
            100% {
                transform: translateY(105vh) rotate(180deg) scale(0.3);
                opacity: 0;
            }
        }

        /* 结果弹窗内容 */
        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: resultFadeIn 0.5s ease-out;
        }

        @keyframes resultFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-emoji {
            font-size: 70px;
            animation: resultBounce 0.7s ease-out;
        }

        @keyframes resultBounce {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.25);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .result-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff4081;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(255,64,129,0.2);
        }

        .result-subtext {
            font-size: 0.9rem;
            color: #b8909e;
            font-weight: 500;
        }

        .btn-close-result {
            margin-top: 14px;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255,64,129,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 0.5px;
        }

        .btn-close-result:hover {
            transform: scale(1.07);
            box-shadow: 0 8px 24px rgba(255,64,129,0.5);
        }
        .btn-close-result:active {
            transform: scale(0.93);
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .modal {
                padding: 24px 16px 20px;
                border-radius: 20px;
                min-height: 270px;
            }
            .modal-question {
                font-size: 1.05rem;
            }
            .modal-icon {
                font-size: 40px;
            }
            .btn {
                padding: 11px 24px;
                font-size: 0.95rem;
                min-width: 72px;
            }
            .btn-area {
                height: 140px;
            }
            .btn-yes {
                bottom: 16px;
                right: 24px;
            }
            .btn-no {
                bottom: 16px;
                left: 24px;
            }
            .result-text {
                font-size: 1.3rem;
            }
            .result-emoji {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景浮动爱心 -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay">
        <!-- 弹窗 -->
        <div class="modal" id="modal">
            <!-- 图标 -->
            <div class="modal-icon">🗳️</div>
            <!-- 问题 -->
            <p class="modal-question">宁芙奖投囚徒好不好？</p>
            <p class="modal-subtitle">请做出你的选择~</p>

            <!-- 按钮区域 -->
            <div class="btn-area" id="btnArea">
                <!-- Yes按钮 - 固定 -->
                <button class="btn btn-yes" id="btnYes">✅ Yes</button>
                <!-- No按钮 - 会逃跑 -->
                <button class="btn btn-no" id="btnNo">❌ No</button>
            </div>
        </div>
    </div>

    <!-- 爱心爆发容器 -->
    <div class="hearts-burst" id="heartsBurst"></div>

    <script>
        (function() {
            // ===== DOM元素 =====
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            const btnArea = document.getElementById('btnArea');
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const heartsBurst = document.getElementById('heartsBurst');
            const floatingHearts = document.getElementById('floatingHearts');

            // ===== 状态 =====
            let noClickAttempts = 0;
            let isResultShown = false;
            let noBtnMoving = false;

            // ===== No按钮的逃跑文字序列 =====
            const noTexts = [
                '❌ No',
                '❌ No 😅',
                '❌ 别点我 🤭',
                '❌ 抓不到~ 😝',
                '❌ 放弃吧 💀',
                '❌ 真的抓不到 😈',
                '❌ 别挣扎了 🏃💨',
                '❌ 认命吧~ ✨',
                '❌ 嘿嘿 🤪',
                '❌ 点Yes吧 🙈',
            ];

            // ===== 初始化背景浮动爱心 =====
            function createFloatingHearts() {
                const heartEmojis = ['💕', '💖', '💗', '💝', '💘', '🩷', '🌸', '💐', '✨', '💫', '🦋', '💞'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 22; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'floating-heart';
                    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                    heart.style.left = Math.random() * 94 + '%';
                    heart.style.fontSize = (Math.random() * 22 + 16) + 'px';
                    heart.style.animationDuration = (Math.random() * 8 + 7) + 's';
                    heart.style.animationDelay = (Math.random() * 8) + 's';
                    fragment.appendChild(heart);
                }
                floatingHearts.appendChild(fragment);
            }
            createFloatingHearts();

            // ===== 获取弹窗边界（相对于btnArea） =====
            function getModalBounds() {
                const areaRect = btnArea.getBoundingClientRect();
                const btnNoRect = btnNo.getBoundingClientRect();
                const btnYesRect = btnYes.getBoundingClientRect();

                // No按钮在btnArea内的活动范围
                const paddingX = 4;
                const paddingY = 4;
                const minLeft = paddingX;
                const maxLeft = areaRect.width - btnNoRect.width - paddingX;
                const minTop = paddingY;
                const maxTop = areaRect.height - btnNoRect.height - paddingY;

                // Yes按钮在btnArea内的位置（转换为相对于btnArea的坐标）
                const yesLeft = btnYesRect.left - areaRect.left;
                const yesTop = btnYesRect.top - areaRect.top;
                const yesRight = yesLeft + btnYesRect.width;
                const yesBottom = yesTop + btnYesRect.height;

                return {
                    minLeft,
                    maxLeft,
                    minTop,
                    maxTop,
                    yesLeft,
                    yesTop,
                    yesRight,
                    yesBottom,
                    btnNoWidth: btnNoRect.width,
                    btnNoHeight: btnNoRect.height,
                    areaWidth: areaRect.width,
                    areaHeight: areaRect.height,
                };
            }

            // ===== 检查两个矩形是否重叠 =====
            function isOverlapping(ax, ay, aw, ah, bx, by, bw, bh) {
                const margin = 16;
                return !(
                    ax + aw + margin < bx ||
                    ax > bx + bw + margin ||
                    ay + ah + margin < by ||
                    ay > by + bh + margin
                );
            }

            // ===== 移动No按钮到随机位置 =====
            function moveNoButton() {
                if (isResultShown) return;
                if (noBtnMoving) return;
                noBtnMoving = true;

                const bounds = getModalBounds();
                const bw = bounds.btnNoWidth;
                const bh = bounds.btnNoHeight;

                let newLeft, newTop;
                let attempts = 0;
                const maxAttempts = 60;
                let validPosition = false;

                while (attempts < maxAttempts) {
                    newLeft = bounds.minLeft + Math.random() * (bounds.maxLeft - bounds.minLeft);
                    newTop = bounds.minTop + Math.random() * (bounds.maxTop - bounds.minTop);

                    if (!isOverlapping(
                            newLeft, newTop, bw, bh,
                            bounds.yesLeft, bounds.yesTop,
                            bounds.yesRight - bounds.yesLeft,
                            bounds.yesBottom - bounds.yesTop
                        )) {
                        validPosition = true;
                        break;
                    }
                    attempts++;
                }

                if (!validPosition) {
                    if (bounds.yesLeft > bounds.areaWidth / 2) {
                        newLeft = bounds.minLeft + Math.random() * 40;
                    } else {
                        newLeft = bounds.maxLeft - Math.random() * 40;
                    }
                    newTop = bounds.minTop + Math.random() * (bounds.maxTop - bounds.minTop);
                    newLeft = Math.max(bounds.minLeft, Math.min(bounds.maxLeft, newLeft));
                    newTop = Math.max(bounds.minTop, Math.min(bounds.maxTop, newTop));
                }

                noClickAttempts++;
                const textIndex = Math.min(noClickAttempts, noTexts.length - 1);
                btnNo.textContent = noTexts[textIndex];

                btnNo.style.left = newLeft + 'px';
                btnNo.style.top = newTop + 'px';
                btnNo.style.bottom = 'auto';

                btnNo.classList.remove('fleeing');
                void btnNo.offsetWidth;
                btnNo.classList.add('fleeing');

                if (noClickAttempts % 3 === 1 && noClickAttempts > 2) {
                    modal.classList.remove('shake');
                    void modal.offsetWidth;
                    modal.classList.add('shake');
                    setTimeout(() => modal.classList.remove('shake'), 450);
                }

                if (noClickAttempts >= 8) {
                    const scale = Math.max(0.7, 1 - (noClickAttempts - 8) * 0.04);
                    btnNo.style.transform = `scale(${scale})`;
                    btnNo.style.opacity = Math.max(0.5, 1 - (noClickAttempts - 8) * 0.06);
                }

                setTimeout(() => {
                    noBtnMoving = false;
                }, 100);
            }

            // ===== No按钮事件 =====
            btnNo.addEventListener('mouseenter', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                moveNoButton();
            });

            btnNo.addEventListener('touchstart', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                moveNoButton();
            }, { passive: false });

            btnNo.addEventListener('click', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                e.stopPropagation();
                moveNoButton();
            });

            // ===== Yes按钮点击弹出电电喜欢你 =====
            btnYes.addEventListener('click', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                e.stopPropagation();
