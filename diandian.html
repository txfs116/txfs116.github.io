<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁芙奖投票</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-light: #ffa3c4;
            --pink-dark: #e8557d;
            --bg: #fff0f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe4ec 0%, #fff0f5 30%, #ffe0ec 60%, #fce4ec 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp linear infinite;
            opacity: 0.35;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            8% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.3;
            }
            85% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(-15vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            position: relative;
            width: min(460px, 92vw);
            min-height: 320px;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 28px 28px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.25), 0 8px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
            z-index: 101;
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ffe0ec;
            overflow: visible;
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(30px); opacity: 0; }
            60% { transform: scale(1.04) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal.shake {
            animation: shakeModal 0.45s ease-out;
        }

        @keyframes shakeModal {
            0%,100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(2px); }
        }

        .modal-icon {
            font-size: 52px;
            margin-bottom: 8px;
            animation: bounceIcon 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounceIcon {
            0%,100% { transform: translateY(0); }
            30% { transform: translateY(-14px); }
            50% { transform: translateY(0); }
            70% { transform: translateY(-8px); }
            85% { transform: translateY(0); }
        }

        .modal-question {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a3040;
            margin-bottom: 6px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: #b8909e;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .btn-area {
            position: relative;
            width: 100%;
            height: 180px;
            margin-top: 10px;
        }

        .btn {
            position: absolute;
            padding: 13px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 0.8px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
            outline: none;
            z-index: 10;
            white-space: nowrap;
            min-width: 90px;
            text-align: center;
            word-break: keep-all;
        }

        .btn:active { transform: scale(0.92); }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: #fff;
            box-shadow: 0 6px 22px rgba(255, 64, 129, 0.4);
            bottom: 20px;
            right: 50px;
            z-index: 20;
            animation: pulseYes 2.2s ease-in-out infinite;
            border: 2px solid #ff4081;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(255, 64, 129, 0.55);
            background: linear-gradient(135deg, #ff7dae 0%, #ff5090 100%);
        }

        .btn-yes:active {
            transform: scale(0.9);
            box-shadow: 0 4px 14px rgba(255, 64, 129, 0.5);
        }

        @keyframes pulseYes {
            0%,100% { box-shadow: 0 6px 22px rgba(255, 64, 129, 0.4); }
            50% { box-shadow: 0 10px 34px rgba(255, 64, 129, 0.7), 0 0 0 10px rgba(255, 107, 157, 0.1); }
        }

        .btn-no {
            background: #f5f5f5;
            color: #888;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            bottom: 20px;
            left: 50px;
            z-index: 15;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            min-width: 120px;
        }

        .btn-no:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
            background: #eee;
        }

        .btn-no.fleeing {
            animation: fleePop 0.2s ease-out;
        }

        @keyframes fleePop {
            0% { transform: scale(1); }
            40% { transform: scale(0.75); }
            100% { transform: scale(1); }
        }

        .hearts-burst {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        .burst-heart {
            position: absolute;
            font-size: 30px;
            animation: burstFall 1.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes burstFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            30% { opacity: 1; transform: translateY(-60px) rotate(25deg) scale(1.4); }
            100% { transform: translateY(105vh) rotate(180deg) scale(0.3); opacity: 0; }
        }

        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: resultFadeIn 0.5s ease-out;
        }

        @keyframes resultFadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-emoji {
            font-size: 70px;
            animation: resultBounce 0.7s ease-out;
        }

        @keyframes resultBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.25); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .result-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff4081;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(255, 64, 129, 0.2);
        }

        .result-subtext {
            font-size: 0.9rem;
            color: #b8909e;
            font-weight: 500;
        }

        .btn-close-result {
            margin-top: 14px;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 64, 129, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 0.5px;
        }

        .btn-close-result:hover {
            transform: scale(1.07);
            box-shadow: 0 8px 24px rgba(255, 64, 129, 0.5);
        }
        .btn-close-result:active {
            transform: scale(0.93);
        }

        @media (max-width: 480px) {
            .modal {
                padding: 24px 16px 20px;
                border-radius: 20px;
                min-height: 290px;
            }
            .modal-question { font-size: 1.05rem; }
            .modal-icon { font-size: 40px; }
            .btn {
                padding: 11px 20px;
                font-size: 0.9rem;
                min-width: 80px;
            }
            .btn-area { height: 160px; }
            .btn-yes { bottom: 16px; right: 24px; }
            .btn-no { bottom: auto; left: 24px; min-width: 100px; }
            .result-text { font-size: 1.3rem; }
            .result-emoji { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="overlay" id="overlay">
        <div class="modal" id="modal">
            <div class="modal-icon">🗳️</div>
            <p class="modal-question">宁芙奖投囚徒好不好？</p>
            <p class="modal-subtitle">请做出你的选择~</p>
            <div class="btn-area" id="btnArea">
                <button class="btn btn-yes" id="btnYes">✅ Yes</button>
                <button class="btn btn-no" id="btnNo">❌ No</button>
            </div>
        </div>
    </div>
    <div class="hearts-burst" id="heartsBurst"></div>

    <script>
        (function() {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            const btnArea = document.getElementById('btnArea');
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const heartsBurst = document.getElementById('heartsBurst');
            const floatingHearts = document.getElementById('floatingHearts');

            let noClickAttempts = 0;
            let isResultShown = false;
            let noBtnMoving = false;

            const noTexts = [
                '❌ No',
                '你不想投我吗？😢',
                '求求你了，投我吧🥺',
                '再不投腰不想要了😭'
            ];

            function createFloatingHearts() {
                const heartEmojis = ['💕', '💖', '💗', '💝', '💘', '🩷', '🌸', '💐', '✨', '💫', '🦋', '💞'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 22; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'floating-heart';
                    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                    heart.style.left = Math.random() * 94 + '%';
                    heart.style.fontSize = (Math.random() * 22 + 16) + 'px';
                    heart.style.animationDuration = (Math.random() * 8 + 7) + 's';
                    heart.style.animationDelay = (Math.random() * 8) + 's';
                    fragment.appendChild(heart);
                }
                floatingHearts.appendChild(fragment);
            }
            createFloatingHearts();

            function getModalBounds() {
                const areaRect = btnArea.getBoundingClientRect();
                const btnNoRect = btnNo.getBoundingClientRect();
                const btnYesRect = btnYes.getBoundingClientRect();

                const paddingX = 4;
                const paddingY = 4;
                const minLeft = paddingX;
                const maxLeft = areaRect.width - btnNoRect.width - paddingX;
                const minTop = paddingY;
                const maxTop = areaRect.height - btnNoRect.height - paddingY;

                const yesLeft = btnYesRect.left - areaRect.left;
                const yesTop = btnYesRect.top - areaRect.top;
                const yesRight = yesLeft + btnYesRect.width;
                const yesBottom = yesTop + btnYesRect.height;

                return {
                    minLeft,maxLeft,minTop,maxTop,
                    yesLeft,yesTop,yesRight,yesBottom,
                    btnNoWidth: btnNoRect.width,
                    btnNoHeight: btnNoRect.height,
                    areaWidth: areaRect.width,
                    areaHeight: areaRect.height,
                };
            }

            function isOverlapping(ax, ay, aw, ah, bx, by, bw, bh) {
                const margin = 20;
                return !(
                    ax + aw + margin < bx ||
                    ax > bx + bw + margin ||
                    ay + ah + margin < by ||
                    ay > by + bh + margin
                );
            }

            function moveNoButton() {
                if (isResultShown || noBtnMoving) return;
                noBtnMoving = true;

                const bounds = getModalBounds();
                const bw = bounds.btnNoWidth;
                const bh = bounds.btnNoHeight;

                let newLeft, newTop;
                let attempts = 0;
                const maxAttempts = 60;
                let validPosition = false;

                while (attempts < maxAttempts) {
                    newLeft = bounds.minLeft + Math.random() * (bounds.maxLeft - bounds.minLeft);
                    newTop = bounds.minTop + Math.random() * (bounds.maxTop - bounds.minTop);
                    if (!isOverlapping(newLeft,newTop,bw,bh,
                        bounds.yesLeft,bounds.yesTop,
                        bounds.yesRight-bounds.yesLeft,
                        bounds.yesBottom-bounds.yesTop)) {
                        validPosition = true;
                        break;
                    }
                    attempts++;
                }

                if (!validPosition) {
                    if (bounds.yesLeft > bounds.areaWidth / 2) {
                        newLeft = bounds.minLeft + Math.random() * 40;
                    } else {
                        newLeft = bounds.maxLeft - Math.random() * 40;
                    }
                    newTop = bounds.minTop + Math.random() * (bounds.maxTop - bounds.minTop);
                    newLeft = Math.max(bounds.minLeft, Math.min(bounds.maxLeft, newLeft));
                    newTop = Math.max(bounds.minTop, Math.min(bounds.maxTop, newTop));
                }

                noClickAttempts++;
                const textIndex = Math.min(noClickAttempts, noTexts.length - 1);
                btnNo.textContent = noTexts[textIndex];

                btnNo.style.left = newLeft + 'px';
                btnNo.style.top = newTop + 'px';
                btnNo.style.bottom = 'auto';

                btnNo.classList.remove('fleeing');
                void btnNo.offsetWidth;
                btnNo.classList.add('fleeing');

                if (noClickAttempts % 2 === 1 && noClickAttempts > 1) {
                    modal.classList.remove('shake');
                    void modal.offsetWidth;
                    modal.classList.add('shake');
                    setTimeout(() => modal.classList.remove('shake'), 450);
                }

                setTimeout(() => {
                    noBtnMoving = false;
                }, 100);

                if (noClickAttempts >= 6) {
                    const scale = Math.max(0.75, 1 - (noClickAttempts - 6) * 0.04);
                    btnNo.style.transform = `scale(${scale})`;
                    btnNo.style.opacity = Math.max(0.55, 1 - (noClickAttempts - 6) * 0.06);
                }
            }

            btnNo.addEventListener('mouseenter', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                moveNoButton();
            });

            btnNo.addEventListener('touchstart', function(e) {
                if (isResultShown) return;
                e.preventDefault();
                moveNoButton();
            });

            btnYes.addEventListener('click', function() {
                if (isResultShown) return;
                isResultShown = true;

                for(let i=0;i<18;i++){
                    createBurstHeart();
                }

                modal.innerHTML = `
                    <div class="result-content">
                        <div class="result-emoji">💖</div>
                        <div class="result-text">投票成功！</div>
                        <div class="result-subtext">感谢支持囚徒宁芙奖✨</div>
                        <button class="btn-close-result" id="btnClose">关闭</button>
                    </div>
                `;

                document.getElementById('btnClose').addEventListener('click',()=>{
                    overlay.style.display = 'none';
                });
            });

            function createBurstHeart(){
                const heart = document.createElement('span');
                heart.className = 'burst-heart';
                const emojis = ['💕','💖','💗','💝','💘','🩷'];
                heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                heart.style.left = 50 + (Math.random()-0.5)*30 + '%';
                heart.style.top = 40 + (Math.random()-0.5)*20 + '%';
                heartsBurst.appendChild(heart);
                setTimeout(()=>heart.remove(),1800);
            }
        })();
    </script>
</body>
</html>
